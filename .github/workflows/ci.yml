name: CI

# Logic-slice CI. Runs the default (no-feature) build: types / catalog /
# geometry / resolve / runs / meta / save plus the full integration suite.
# The `render` and `runtime` features (wgpu / winit / hecs) are deliberately
# NOT enabled — they need a GPU + windowing, and the two bins are gated
# behind `required-features = ["render", "runtime"]`, so the default build
# never compiles them. That keeps this workflow headless and green on a
# plain Ubuntu runner with no GPU. See Cargo.toml `[features]` for the
# rationale ("Tester's CI loop ... run here").

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

# Cancel superseded runs on the same ref so a fast push train doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy (stable, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Formatting gate. The one-time repo-wide `cargo fmt` sweep landed in the
      # Rust-quality Phase 0 (#150, H1 of the review), so the tree is now
      # rustfmt-clean and this can be enforced — a drift slipped through the
      # clippy-only gate once, which is the systemic hole this closes (review
      # rec M-B). `--check` fails (non-zero) on any unformatted file without
      # rewriting it, so CI reports the drift for the author to `cargo fmt`.
      # Runs before clippy so a formatting nit is reported as exactly that, not
      # masked by a lint failure.
      - name: fmt
        run: cargo fmt --all -- --check

      # Clippy on the default feature set, all targets, warnings DENIED. The
      # non-render bins are skipped automatically by their required-features.
      # The whole-tree lint backlog is cleared (render files #126, resolve.rs
      # #101, types/meta/runs/mesh_import #100), so `-D warnings` now holds.
      # `-D warnings` is scoped to clippy (not a global RUSTFLAGS) so the test
      # steps below don't also fail on warnings.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # The suite: lib unit tests + every tests/*.rs integration file.
      - name: test
        run: cargo test --all-targets

      # Doctests aren't covered by --all-targets; run them explicitly so the
      # worked examples in module docs stay compilable.
      - name: doctests
        run: cargo test --doc
