[package]
name = "broadside-engine"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Broadside space-combat resolver — canonical reference: broadside-engine/engine/types.ts"
repository = "https://github.com/kilt-er/broadside-engine"
license = "MIT OR Apache-2.0"
# MSRV: pinned to the toolchain in rust-toolchain.toml; informal N-2 support policy.
rust-version = "1.95"
keywords = ["game", "tactics", "roguelike", "naval", "wargame"]
categories = ["games", "simulation"]

[features]
# Default build is the types/catalog/geometry/resolve slice — pure logic with
# no rendering or windowing. Tester's CI loop and content's checks run here;
# wgpu/winit/naga are NOT compiled.
default = []
# Enable when the renderer crate / wgpu pipeline is being built. Pulls in
# wgpu, winit, pollster, bytemuck.
render = ["dep:wgpu", "dep:winit", "dep:pollster", "dep:bytemuck", "dep:image"]
# Enable for the runtime ECS / logging surface (hecs world, env_logger).
# Resolver and content don't need this for type-check builds.
runtime = ["dep:hecs", "dep:log", "dep:env_logger"]
# Optional: pulls in `kira` for procedural / sample-based sound playback.
# The bin subscribes to EventBus hooks (OnDamageDealt / OnLethal / OnVent
# / OnReorient / OnChainKill) and plays placeholder synthesized sounds.
# Default OFF — tests and CI builds skip the OS audio device.
audio = ["dep:kira"]

[dependencies]
# Used by the types + catalog slice — always compiled. `serde_json` also
# backs the per-run save/load (`Run::save_to_disk` / `load_from_disk`).
# Task #79 originally specced postcard, but postcard can't encode
# internally-tagged enums and `Orientation` is `#[serde(tag = "stance")]`
# for byte-stable JSON-catalog round-trip with the TS engine. Run state
# is only ~5 KB; the binary-format size win is immaterial. See
# `src/save.rs` module doc for the full rationale.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# glTF (.glb / .gltf) import for CAD-tool ship meshes. The son's Broadside CAD
# editor exports baked meshes as .glb (Three.js GLTFExporter); `mesh_import`
# reads them into a `HullMesh` the loft render path consumes. The `import`
# feature pulls buffer/base64 decoding so a self-contained .glb parses from
# bytes. Always compiled (not optional, no feature gate): it's pure parsing,
# no wgpu, so it stays CI-testable headless alongside the loft math.
gltf = { version = "1", features = ["import", "utils", "extras", "KHR_materials_unlit"] }

# Toolchain-aligned with C:\Users\bruce\GameEngine\mvp. Versions are pinned
# at the crate level so workspace promotion is mechanical, but each crate is
# `optional = true` and gated behind a feature so the default build stays
# fast for the slice that doesn't need rendering or the ECS host.
hecs = { version = "0.10", optional = true }
wgpu = { version = "26", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
# PNG decode/encode for sprite sheets and the SPRITE_SPEC.md reference
# renders. PNG-only to keep the dep small; `default-features = false`
# drops jpeg/gif/etc.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Audio playback. `cpal` backend is the default and works cross-platform.
# Gated under the `audio` feature so the default build doesn't pull the
# OS audio device or the cpal dependency tree.
kira = { version = "0.10", optional = true }

# Runnable demo: opens a window and renders a Broadside scene using the
# gfx / atlas / hud modules. The library is the canonical home for renderer
# code; this binary just wires winit + Gfx::new and runs the event loop.
# Gated on `render` + `runtime` so the default `cargo build` (resolver and
# content slice) does not compile wgpu or env_logger.
[[bin]]
name = "broadside"
path = "src/bin/broadside.rs"
required-features = ["render", "runtime"]

# Offline tool: renders the procedural ship silhouette at each scrub angle
# to a PNG under docs/sprite-refs/. Bruce uses these as templates when
# painting real PNG sprites. Pure CPU rasterizer; no wgpu/winit. The bin
# still pulls `image` via the render feature.
[[bin]]
name = "render_refs"
path = "src/bin/render_refs.rs"
required-features = ["render", "runtime"]

# Standalone spike: the loft render pipeline (3D-lofted capital-ship hull →
# ortho ¾ depth pass → 160×100 nearest offscreen → posterize → upscale).
# Self-contained — imports NO broadside_engine module. Needs `render,runtime`
# (not `render` alone) only because the crate LIBRARY it links against pulls
# `log`/`sprites` behind `runtime`; the bin itself uses `eprintln!` and touches
# no engine module. Run: `cargo run --bin loft_poc --features render,runtime`.
[[bin]]
name = "loft_poc"
path = "src/bin/loft_poc.rs"
required-features = ["render", "runtime"]

# Visual harness for the v2 5×4 board geometry: renders the empty grid through
# the D2 perspective projector over a parallax-style backdrop, plus mock ships
# (with bow-direction arrows) and mock threats (red move-fill + gold shield
# pips). Depends ONLY on the renderer modules already green over the frozen
# grid.rs (projector / gfx / atlas / background / grid) — NOT types/resolve/hud
# (mid-A3), so it can't collide with the type migration. Stages the D3/D4 draw
# logic for lift into hud.rs once A3.1 lands. Run:
# `cargo run --bin grid_preview --features render,runtime`.
[[bin]]
name = "grid_preview"
path = "src/bin/grid_preview.rs"
required-features = ["render", "runtime"]

# Real-board preview: the campaign's first-encounter 5×4 formation (a faithful
# synthetic board matching content C4's spawn layout) rendered through the
# production hud::compose_scene_2d — real ship.pos/facing/shield pips, the D2
# projector, bow arrows, parallax backdrop. The interim "see the REAL board"
# path while compose_scene_2d's wiring into broadside.rs proper stays held. Run:
# `cargo run --bin encounter_preview --features render,runtime`.
[[bin]]
name = "encounter_preview"
path = "src/bin/encounter_preview.rs"
required-features = ["render", "runtime"]

# Headless offscreen → PNG capture: renders ONE frame of the real combat board
# (campaign bow-to-bow layout, Aegis loft player + CAD enemies) through the same
# pipelines the game uses, with NO window/display, and writes a PNG. The
# permanent "give the team eyes" tool so anyone (incl. an AI agent) can SEE the
# rendered frame by Reading the file. Run:
# `cargo run --bin capture --features render,runtime -- bugs/current_state.png`.
[[bin]]
name = "capture"
path = "src/bin/capture.rs"
required-features = ["render", "runtime"]

# Dynamic-lighting test: 180° key-light sweep on a placeholder wedge hull to
# bugs/light_sweep/. `cargo run --bin light_sweep --features render,runtime`.
[[bin]]
name = "light_sweep"
path = "src/bin/light_sweep.rs"
required-features = ["render", "runtime"]

# Faithful Aegis: imports + verifies + renders assets/ships/Aegis.glb (at-rest +
# light-sweep) to bugs/aegis/. `cargo run --bin render_aegis --features render,runtime`.
[[bin]]
name = "render_aegis"
path = "src/bin/render_aegis.rs"
required-features = ["render", "runtime"]

[dev-dependencies]
# Property-based testing for the band_falloff overflow / clamp invariant
# and the absorb_shield (dmg, armour, charge) state machine. Avoid using
# proptest elsewhere — enumerated tables are clearer for finite domains.
proptest = "1"
